name: pkmgmt-v4-sandbox

services:
  wordpress:
    image: wordpress:6.7-php8.3
    ports:
      - "8081:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp
      WORDPRESS_DEBUG: "1"
    volumes:
      - wp_data:/var/www/html
      - .:/var/www/html/wp-content/plugins/parking-management
    depends_on:
      db:
        condition: service_healthy

  cli:
    image: wordpress:cli-2.10-php8.3
    user: "33:33"
    volumes:
      - wp_data:/var/www/html
      - .:/var/www/html/wp-content/plugins/parking-management
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["tail", "-f", "/dev/null"]

  db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wp
      MYSQL_USER: wp
      MYSQL_PASSWORD: wp
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wp_data:
  db_data:
